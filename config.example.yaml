# ============================================================================
#  CONFIGURATION — edit this file, it is git-ignored so it is safe to keep
#  your keys in it. Copy config.example.yaml -> config.yaml to start.
# ============================================================================

# The public name of this tool. Must NOT contain "YouTube" (Google branding rule).
# Keep this identical to the app name on the Google Auth Platform branding page
# and to the "Nome del client API" field in the API audit form.
app_name: "Curiosity Compass"

channel:
  # The topic of your channel. This drives every generated script and image.
  # Be specific — "history" is weak, "forgotten medieval engineering" is strong.
  topic: "unusual true stories from maritime history"

  # Tone of the narration. Examples: calm and factual, dark and dramatic,
  # warm and conversational, dry and witty.
  tone: "calm, factual, quietly dramatic"

  # Who is speaking. Affects the voice and the writing.
  audience: "curious adults who like short documentary-style videos"

  # Target length of the finished video, in seconds.
  # 90-180 is the sweet spot for retention on a new channel.
  target_seconds: 150

  # Language / accent for the voiceover (BCP-47 style edge-tts voice).
  # Free options include:
  #   en-US-AriaNeural      en-US-GuyNeural       en-US-JennyNeural
  #   en-GB-RyanNeural      en-GB-SoniaNeural     en-AU-NatashaNeural
  #   it-IT-ElsaNeural      it-IT-DiegoNeural     de-DE-KatjaNeural
  # Full list: python -m edge_tts --list-voices
  voice: "en-GB-RyanNeural"

  # Spoken language, used to prompt the script writer.
  language: "English"

  # YouTube category id. 22=People & Blogs, 27=Education, 24=Entertainment,
  # 15=Pets & Animals, 17=Sports, 10=Music, 20=Gaming, 28=Science & Technology
  category_id: "22"

  # Extra tags appended to every video.
  default_tags: []

video:
  width: 1920
  height: 1080
  fps: 30
  # Gentle Ken Burns zoom. 1.0 = static image, 1.12 = slow push in.
  zoom: 1.12
  # Crossfade between scenes, seconds.
  transition: 0.5

privacy:
  # ----------------------------------------------------------------------
  #  IMPORTANT — READ THIS BEFORE SETTING TO "public"
  # ----------------------------------------------------------------------
  # YouTube force-locks to PRIVATE every video uploaded from an API project
  # that has not passed the Compliance Audit, and those videos can NEVER be
  # unlocked or appealed — you must re-upload them.
  #
  # So: keep this "private" until your audit is approved. Then change it.
  #
  # The uploader also refuses to upload public videos while
  # audit_passed below is false.
  # ----------------------------------------------------------------------
  status: "private"          # private | unlisted | public

  # Flip to true ONLY after Google approves your Compliance Audit.
  audit_passed: false

  # Safety net: how many uploads per run before the tool stops itself.
  # Default YouTube allowance is 100 videos.insert calls/day.
  max_uploads_per_run: 3

ai:
  # Which script writer to use.
  #   "gemini"   -> best quality. Needs a FREE key from https://aistudio.google.com/apikey
  #   "template" -> no key, no network. Lower quality but always works.
  provider: "gemini"

  # Paste your free Gemini key here, or set GEMINI_API_KEY in the environment.
  # Leave blank to use the environment variable.
  gemini_api_key: ""
  gemini_model: "gemini-flash-latest"

  # Images are generated by Pollinations, which is free and needs NO key.
  # Verified working: 3/3 requests returned valid 1024x576 JPEGs.
  image_provider: "pollinations"
  image_width: 1280
  image_height: 720
  # Seconds to wait per image before giving up.
  image_timeout: 90

paths:
  work_dir: "work"
  out_dir: "out"
  state_file: "state.json"

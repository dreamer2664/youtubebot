<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>

  <text x="640" y="58" fill="#f8fafc" font-size="34" font-weight="bold" text-anchor="middle">youtubebot — architecture</text>
  <text x="640" y="92" fill="#94a3b8" font-size="18" text-anchor="middle">Personal desktop tool · single operator · single YouTube channel · no third-party users</text>

  <!-- local boundary -->
  <rect x="60" y="130" width="700" height="470" rx="14" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="82" y="164" fill="#64748b" font-size="17" font-weight="bold">OPERATOR'S OWN COMPUTER — nothing leaves this box except the upload</text>

  <!-- pipeline boxes -->
  <g font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">
    <rect x="110" y="205" width="240" height="76" rx="10" fill="#38bdf8"/>
    <text x="230" y="238">1. Script</text>
    <text x="230" y="264" font-size="15" font-weight="normal">Gemini API (free tier)</text>

    <rect x="110" y="315" width="240" height="76" rx="10" fill="#34d399"/>
    <text x="230" y="348">2. Images</text>
    <text x="230" y="374" font-size="15" font-weight="normal">Pollinations (no key)</text>

    <rect x="110" y="425" width="240" height="76" rx="10" fill="#fbbf24"/>
    <text x="230" y="458">3. Voiceover</text>
    <text x="230" y="484" font-size="15" font-weight="normal">edge-tts (no key)</text>

    <rect x="470" y="315" width="240" height="76" rx="10" fill="#f472b6"/>
    <text x="590" y="348">4. Assemble</text>
    <text x="590" y="374" font-size="15" font-weight="normal">FFmpeg, local only</text>

    <rect x="470" y="455" width="240" height="76" rx="10" fill="#a78bfa"/>
    <text x="590" y="488">5. Review</text>
    <text x="590" y="514" font-size="15" font-weight="normal">operator, every video</text>
  </g>

  <!-- arrows inside -->
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M230 281 L230 315"/>
    <path d="M230 391 L230 425"/>
    <path d="M350 463 C410 463 410 391 470 366"/>
    <path d="M590 391 L590 455"/>
  </g>

  <!-- storage -->
  <rect x="110" y="530" width="600" height="52" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="410" y="562" fill="#cbd5e1" font-size="16" text-anchor="middle">local state.json — IDs + status of videos I uploaded, so runs can resume</text>

  <!-- boundary to youtube -->
  <path d="M760 480 L900 480" stroke="#f87171" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <text x="830" y="462" fill="#f87171" font-size="15" text-anchor="middle" font-weight="bold">videos.insert</text>
  <text x="830" y="508" fill="#94a3b8" font-size="14" text-anchor="middle">OAuth 2.0</text>

  <!-- youtube -->
  <rect x="900" y="390" width="320" height="180" rx="14" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="1060" y="432" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle">YouTube</text>
  <text x="1060" y="466" fill="#cbd5e1" font-size="16" text-anchor="middle">one channel,</text>
  <text x="1060" y="490" fill="#cbd5e1" font-size="16" text-anchor="middle">owned by the operator</text>
  <text x="1060" y="530" fill="#94a3b8" font-size="14" text-anchor="middle">videos.list · videos.update</text>
  <text x="1060" y="550" fill="#94a3b8" font-size="14" text-anchor="middle">thumbnails.set · channels.list</text>

  <!-- facts -->
  <g font-size="16" fill="#cbd5e1">
    <rect x="60" y="626" width="1160" height="62" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="653">• One authorising Google account (the operator) · one OAuth desktop client · one project: my-uploader-508220</text>
    <text x="84" y="676">• Traffic 1–3 videos.insert/day, well under the 100/day default · no user data collected, stored, or shared</text>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="b" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f87171"/></marker>
  </defs>
</svg>
